<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Desk panel</title>

<!--
  The desk panel's readings, laid out for a phone held sideways.

  This used to be the panel redrawn stroke for stroke on a 320-wide canvas, and
  the fidelity is what broke it. Nothing on a canvas has a baseline until you
  work one out, so the big faces were centred on what the browser said the ink
  of each glyph was -- and Safari and Chrome do not say the same thing. On the
  phone the clock digits climbed out of their cards and the countdown ran into
  the word beside it. There is no fixing that by measuring more carefully: the
  measurement is the thing that differs.

  So the layout is the browser's job now. Grid places the cards, flexbox aligns
  the rows, and every figure is set in tabular figures so that a column of them
  lines up whatever digits it happens to be showing -- which is the other half
  of what looked untidy. Nothing here computes a text position.

  The panel's four hues stay, because they still do the job they were picked
  for: they say which reading you are looking at, not how it is doing. Green,
  amber and red still say the second thing and are still kept clear of the
  first.
-->

<style>
  @font-face {
    font-family: Panel;
    src: url(/font.ttf) format('truetype');
    font-display: swap;
  }

  :root {
    --bg:      #0b0e10;
    --card:    #151a1d;
    --line:    #232b2f;
    --text:    #e9eff1;
    --dim:     #8c999e;
    --faint:   #5c686d;

    /* which reading this is */
    --teal:    #19bfae;
    --blue:    #4b8ef7;
    --violet:  #9b7bf5;
    --pink:    #f0559b;

    /* how that reading is doing */
    --ok:      #35d07f;
    --warn:    #ffab40;
    --err:     #ff5f57;

    --gap:     10px;
    --radius:  14px;

    font-family: Panel, -apple-system, system-ui, "Segoe UI", sans-serif;
    /* Every digit the same width, so a column of figures lines up and a
       countdown does not shuffle sideways once a second. */
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    -webkit-text-size-adjust: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    padding: var(--gap);
    padding: max(var(--gap), env(safe-area-inset-top))
             max(var(--gap), env(safe-area-inset-right))
             max(var(--gap), env(safe-area-inset-bottom))
             max(var(--gap), env(safe-area-inset-left));
    gap: var(--gap);
    overscroll-behavior: none;
    overflow: auto;
    -webkit-tap-highlight-color: transparent;
  }

  /* --- the bar across the top ------------------------------------------- */

  .bar {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--dim);
    flex: none;
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--ok);
    flex: none;
  }
  .bar.off .dot { background: var(--err); }
  .bar.off .link { color: var(--err); }

  .bar .spacer { flex: 1; }

  button {
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 16px;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  button:active { background: #1d2427; }
  button:disabled { color: var(--faint); }

  /* --- the cards --------------------------------------------------------- */

  main {
    flex: 1;
    display: grid;
    gap: var(--gap);
    grid-template-columns: 1fr;
    grid-template-areas: "clock" "usage" "mac" "pomo";
    min-height: 0;
  }

  /* Sideways is what this is for: three columns of readings with the Mac's
     row of cores along the foot, where the width it wants is free. */
  @media (orientation: landscape) {
    main {
      grid-template-columns: 1fr 1.2fr 1fr;
      grid-template-rows: 1fr auto;
      grid-template-areas:
        "clock usage pomo"
        "mac   mac   mac";
    }
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 2px solid var(--hue, var(--line));
    border-radius: var(--radius);
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }

  @media (orientation: landscape) and (max-height: 460px) {
    body { --gap: 8px; }
    .card { padding: 9px 12px; gap: 7px; }
    .bar { font-size: 12px; }
    .bar button { padding: 5px 13px; }
  }

  .clock { grid-area: clock; --hue: var(--teal); }
  .usage { grid-area: usage; --hue: var(--pink); }
  .mac   { grid-area: mac;   --hue: var(--blue); }
  .pomo  { grid-area: pomo;  --hue: var(--violet); }

  .head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--hue);
    flex: none;
  }
  .head .note {
    margin-left: auto;
    letter-spacing: 0;
    text-transform: none;
    font-size: 12px;
    color: var(--dim);
  }
  .note.stale { color: var(--warn); }

  /* --- clock -------------------------------------------------------------- */

  .display {
    font-size: clamp(36px, 12vh, 80px);
    line-height: 1;
    font-weight: 300;
    letter-spacing: -0.02em;
    /* One place to look for the time, so it takes whatever room is spare. */
    margin: auto 0;
    text-align: center;
  }

  .under {
    display: flex;
    justify-content: center;
    gap: 14px;
    font-size: 14px;
    color: var(--dim);
    flex: none;
    flex-wrap: wrap;
  }
  .under b { font-weight: 500; }

  /* --- a gauge ------------------------------------------------------------ */

  /* The two windows, and the charge, spaced apart rather than stacked tight:
     each is a tag, a bar, a figure and a line of small print, and two of them
     touching reads as one block of eight things. */
  #usage-body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
    flex: 1;
  }

  .gauge {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 6px 10px;
  }

  .tag {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    padding: 3px 7px;
    border-radius: 6px;
    color: #0b0e10;
    background: var(--tint, var(--hue));
    min-width: 34px;
    text-align: center;
  }

  .track {
    height: 12px;
    border-radius: 6px;
    background: #0d1113;
    overflow: hidden;
    min-width: 0;
  }

  /* The fill is a window onto a full-width ramp rather than a bar of its own
     colour, so the hue at any point along it means the same thing whatever the
     reading is -- green while there is room, red as the window fills. */
  .fill {
    height: 100%;
    width: calc(var(--f, 0) * 100%);
    overflow: hidden;
    border-radius: 6px;
    position: relative;
  }
  .fill i {
    position: absolute;
    inset: 0;
    width: calc(100% / max(var(--f, 1), 0.001));
    background: linear-gradient(90deg, #35d07f, #b6e34a 45%, #ffab40 72%, #ff5f57);
  }
  .fill.flat i { background: var(--flat, var(--ok)); }

  .figure {
    font-size: clamp(19px, 4.2vmin, 26px);
    font-weight: 500;
    line-height: 1;
    /* Room for three digits and a sign, so 5% and 100% end in the same place. */
    min-width: 3.4em;
    text-align: right;
  }

  .sub {
    grid-column: 1 / -1;
    font-size: 12px;
    color: var(--dim);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .sub .sep { color: var(--faint); }

  /* --- the Mac ------------------------------------------------------------ */

  .macrow {
    display: grid;
    gap: 12px;
    grid-template-columns: 1fr;
    align-items: center;
  }
  @media (orientation: landscape) {
    .macrow { grid-template-columns: minmax(0, 1.1fr) auto minmax(0, 1fr); }
  }

  .cells {
    display: flex;
    gap: 8px;
  }
  .cell {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 9px;
    background: #0d1113;
    border: 1px solid var(--line);
    white-space: nowrap;
  }
  .cell .k { font-size: 11px; color: var(--dim); }
  .cell .v { font-size: 15px; font-weight: 500; margin-left: auto; }

  .cores {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 36px;
    min-width: 0;
  }
  .cores i {
    flex: 1;
    min-width: 0;
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(
      to top,
      var(--c) calc(var(--v, 0) * 100%),
      color-mix(in srgb, var(--c) 22%, transparent) calc(var(--v, 0) * 100%));
  }
  .cores .split { flex: 0 0 10px; background: none; }

  /* --- the pomodoro -------------------------------------------------------- */

  .set {
    display: flex;
    gap: 6px;
    flex: none;
  }
  .set i {
    flex: 1;
    height: 10px;
    border-radius: 5px;
    background: #0d1113;
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .set i b {
    display: block;
    height: 100%;
    width: calc(var(--f, 0) * 100%);
    background: var(--violet);
  }

  .buttons {
    display: flex;
    gap: 8px;
    flex: none;
  }
  .buttons button { flex: 1; padding: 10px 8px; }
  .buttons .go {
    background: var(--violet);
    border-color: var(--violet);
    color: #0b0e10;
    font-weight: 600;
  }
  .buttons .go:active { background: #8a68e8; }

  .state { font-size: 13px; }
  .state.running { color: var(--ok); }
  .state.paused  { color: var(--warn); }
  .state.ready   { color: var(--dim); }

  .miss { color: var(--err); font-size: 13px; }
</style>
</head>

<body>

<div class="bar" id="bar">
  <span class="dot"></span>
  <span class="link" id="link">connected</span>
  <span class="spacer"></span>
  <span id="stamp"></span>
  <button id="refresh">Refresh</button>
</div>

<main>
  <section class="card clock">
    <div class="head">Time<span class="note" id="date"></span></div>
    <div class="display" id="clock">--:--</div>
    <div class="under" id="weather"></div>
  </section>

  <section class="card usage">
    <div class="head">Claude Code<span class="note" id="usage-age"></span></div>
    <div id="usage-body"></div>
  </section>

  <section class="card mac">
    <div class="head">MacBook<span class="note" id="mac-note"></span></div>
    <div id="mac-body"></div>
  </section>

  <section class="card pomo">
    <div class="head">Pomodoro<span class="note state" id="pomo-state"></span></div>
    <div class="display" id="pomo-clock" style="font-size: clamp(32px, 10vh, 64px)">--:--</div>
    <div class="set" id="pomo-set"></div>
    <div class="buttons">
      <button class="go" id="pomo-go">Start</button>
      <button id="pomo-hold">Reset</button>
      <button id="pomo-clear">Clear</button>
    </div>
  </section>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

// --- small shared pieces --------------------------------------------------------

const WDAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MON  = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
              'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

const pad2 = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// "2d 5h" / "3h 05m" / "12m", empty for anything non-positive -- the panel's
// own spans, at the precision that still matters at each size.
function spanText(seconds) {
  if (!(seconds > 0)) return '';
  const dd = Math.floor(seconds / 86400);
  const hh = Math.floor((seconds % 86400) / 3600);
  const mm = Math.floor((seconds % 3600) / 60);
  if (dd > 0) return `${dd}d ${hh}h`;
  if (hh > 0) return `${hh}h ${pad2(mm)}m`;
  return `${mm}m`;
}

// Wall-clock reset, with the weekday once it is more than a day out.
function resetClock(reset, now) {
  if (!(reset > 0)) return '';
  const d = new Date(reset * 1000);
  const clock = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  return reset < now + 86400 ? clock : `${WDAY[d.getDay()]} ${clock}`;
}

// The severity ramp, kept for the figures that are actually graded.
const severity = p => p >= 85 ? 'var(--err)' : p >= 60 ? 'var(--warn)' : 'var(--ok)';
// Charge reads the other way round: a full bar is the good end.
const charge   = p => p <= 20 ? 'var(--err)' : p <= 50 ? 'var(--warn)' : 'var(--ok)';
const tempCol  = t => t >= 35 ? 'var(--err)' : t >= 30 ? 'var(--warn)'
                    : t <= 20 ? 'var(--teal)' : 'var(--ok)';

// One gauge: a tag, a track, a figure, and a line of small print under all
// three. Written once so the usage windows and the Mac's charge line up
// because they are the same markup, not because two sets of numbers were kept
// in step by hand.
function gauge({ tag, tint, pct, fill, figure, sub }) {
  const f = Math.max(0, Math.min(100, pct)) / 100;
  return `<div class="gauge">
    <span class="tag" style="--tint:${tint}">${esc(tag)}</span>
    <div class="track"><div class="fill ${fill ? 'flat' : ''}"
         style="--f:${f.toFixed(4)}${fill ? ';--flat:' + fill : ''}"><i></i></div></div>
    <span class="figure" style="color:${figure.color}">${esc(figure.text)}</span>
    ${sub ? `<div class="sub">${sub}</div>` : ''}
  </div>`;
}

const sep = ' <span class="sep">&middot;</span> ';

// --- what is on screen ------------------------------------------------------------

const state = {
  data: null,
  online: true,
  busy: false,
  baseNow: 0,     // the Mac's clock at the last answer
  baseAt: 0,      // performance.now() when it arrived
};

// The Mac's clock rather than the phone's: every reset time in the payload is
// an epoch the Mac worked out, and a phone whose clock has drifted would push
// every countdown on the page by the drift.
function serverNow() {
  if (!state.baseNow) return Math.floor(Date.now() / 1000);
  return Math.floor(state.baseNow + (performance.now() - state.baseAt) / 1000);
}

const sinceFetch = () => (performance.now() - state.baseAt) / 1000;

// How stale a reading is now, not how stale it was when it arrived -- a failed
// poll would otherwise leave the age frozen and a dead link read as fresh.
function ageNow(reading) {
  if (!reading || reading.error || !(reading.age >= 0)) return -1;
  return Math.floor(reading.age + sinceFetch());
}

// --- the sections -------------------------------------------------------------------

function drawClock(now, weather) {
  const d = new Date(now * 1000);
  $('clock').textContent = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  $('date').textContent = `${WDAY[d.getDay()]} ${pad2(d.getDate())} ${MON[d.getMonth()]}`;

  if (!weather || weather.error || weather.temp === undefined) {
    $('weather').innerHTML =
      `<span class="miss">${esc((weather && weather.error) || 'loading')}</span>`;
    return;
  }
  // Rounded to the degree: the tenth is not a figure anybody reads at a glance.
  $('weather').innerHTML =
    `<span><b style="color:${tempCol(weather.temp)}">${Math.round(weather.temp)}&deg;</b></span>` +
    `<span>feels like <b style="color:${tempCol(weather.feels)}">${Math.round(weather.feels)}&deg;</b></span>` +
    (weather.place ? `<span>${esc(weather.place)}</span>` : '');
}

function drawUsage(u, now) {
  const age = ageNow(u);
  const note = $('usage-age');

  const valid = u && !u.error && (u.h5 >= 0 || u.d7 >= 0);
  if (!valid) {
    note.textContent = '';
    $('usage-body').innerHTML =
      `<div class="miss">${esc((u && u.error) || 'waiting for a reading')}</div>`;
    return;
  }

  // How old the reading is matters as much as the reading: the files behind it
  // only move when something else writes them. One the host went and asked for
  // says "live" instead of counting the seconds since.
  note.textContent = u.live ? 'live'
                   : age < 0 ? ''
                   : age < 90 ? `${age}s ago`
                              : `${Math.floor(age / 60)}m ago`;
  note.className = 'note' + (age > 900 ? ' stale' : '');

  const window_ = (tag, tint, pct, reset) => {
    if (!(pct >= 0)) {
      return gauge({ tag, tint, pct: 0, figure: { text: '--', color: 'var(--faint)' },
                     sub: 'waiting for a reading' });
    }
    const left = spanText(reset - now);
    const when = resetClock(reset, now);
    return gauge({
      tag, tint, pct,
      figure: { text: pct + '%', color: severity(pct) },
      sub: when ? `resets ${when}` + (left ? sep + `in ${left}` : '') : '',
    });
  };

  $('usage-body').innerHTML =
    window_('5H', 'var(--teal)',   u.h5, u.h5_reset) +
    window_('7D', 'var(--violet)', u.d7, u.d7_reset);
}

// How the panel words the display field. "asleep" is the reason for the
// translation: the server means the screens are off while the machine is up,
// and "asleep" printed beside "MacBook" says the opposite of what it means.
function screenWord(display, answering) {
  if (!answering) return 'not answering';
  return { external: 'external', builtin: 'built-in',
           asleep: 'screen off', none: 'no screen' }[display] || '';
}

function drawMac(m, cpu) {
  const age = ageNow(m);
  const valid = m && !m.error;
  const answering = valid && age >= 0 && age <= 30;

  const note = $('mac-note');
  const bits = [];
  if (valid) {
    const word = screenWord(m.display, answering);
    if (word) bits.push(word);
    if (m.bat_state) bits.push(m.bat_state);
    // Shown only once it is old enough to mislead: labelling a fresh number
    // "0s ago" every second is noise.
    if (age > 90) bits.push(`${Math.floor(age / 60)}m ago`);
  }
  note.textContent = bits.join(' · ');
  note.className = 'note' + (valid && (!answering || age > 90) ? ' stale' : '');

  if (!valid) {
    $('mac-body').innerHTML =
      `<div class="miss">${esc((m && m.error) || 'loading')}</div>`;
    return;
  }

  const left = spanText(m.bat_mins * 60);
  const up = spanText(m.uptime_s);
  const bat = gauge({
    tag: 'BAT', tint: 'var(--blue)',
    pct: m.bat_pct >= 0 ? m.bat_pct : 0,
    fill: charge(m.bat_pct),
    figure: { text: m.bat_pct >= 0 ? m.bat_pct + '%' : '--',
              color: m.bat_pct >= 0 ? charge(m.bat_pct) : 'var(--faint)' },
    sub: (left ? `${left} left` : 'no estimate') + (up ? sep + `up ${up}` : ''),
  });

  const haveCpu = cpu && !cpu.error && cpu.cores && cpu.cores.length > 0;
  const cell = (k, v, col) =>
    `<div class="cell"><span class="k">${k}</span>` +
    `<span class="v" style="color:${col}">${v}</span></div>`;

  const cells = '<div class="cells">' +
    cell('Mem',  m.mem_used  >= 0 ? m.mem_used + '%'  : '--',
         m.mem_used  >= 0 ? severity(m.mem_used)  : 'var(--faint)') +
    cell('Disk', m.disk_used >= 0 ? m.disk_used + '%' : '--',
         m.disk_used >= 0 ? severity(m.disk_used) : 'var(--faint)') +
    cell('CPU',  haveCpu && cpu.avg >= 0 ? cpu.avg + '%' : '--',
         haveCpu && cpu.avg >= 0 ? severity(cpu.avg) : 'var(--faint)') +
    '</div>';

  // One column per core, efficiency cores first, with a gap where the clusters
  // meet. The unlit part carries the cluster colour too, at a level that stays
  // behind the fill -- without it an idle Mac is a row of identical grey
  // columns and the distinction disappears exactly when the gap between the
  // groups is the only thing left to read.
  let cores = '';
  if (haveCpu) {
    const split = cpu.ecores > 0 && cpu.pcores > 0;
    cores = '<div class="cores">' + cpu.cores.map((v, i) => {
      const perf = split && i >= cpu.ecores;
      const c = !split ? 'var(--blue)' : perf ? 'var(--pink)' : 'var(--teal)';
      const gap = (split && i === cpu.ecores) ? '<i class="split"></i>' : '';
      const f = Math.max(0, Math.min(100, v)) / 100;
      return `${gap}<i style="--c:${c};--v:${f.toFixed(3)}"></i>`;
    }).join('') + '</div>';
  }

  $('mac-body').innerHTML = `<div class="macrow">${bat}${cells}${cores}</div>`;
}

const PHASE_TINT = { focus: 'var(--pink)', short: 'var(--teal)', long: 'var(--violet)' };
const PHASE_WORD = { focus: 'Focus', short: 'Break', long: 'Long break' };

// What is left now. The server sends what was left when it answered; between
// polls the countdown is this page's own arithmetic, so it moves every second
// rather than every two.
function pomoLeft(p) {
  if (!p) return 0;
  return p.running ? Math.max(0, p.left - sinceFetch()) : p.left;
}

function drawPomo(p) {
  if (!p) {
    $('pomo-state').textContent = '';
    $('pomo-clock').textContent = '--:--';
    return;
  }

  const left = pomoLeft(p);
  // Recomputed rather than trusted from the payload: `fresh` was true when the
  // server answered, and a phase running for a second since is not fresh.
  const fresh = !p.running && left >= p.len;
  const secs = Math.max(0, Math.ceil(left));

  // Rounded up, so a phase says 25:00 for the whole of its first second and
  // 0:00 only when it is actually over. A timer that opens at 24:59 looks
  // broken.
  $('pomo-clock').textContent = `${Math.floor(secs / 60)}:${pad2(secs % 60)}`;
  // The last minute goes amber, which is the only thing on this card the
  // severity ramp is spent on.
  $('pomo-clock').style.color =
    p.running && left < 60 ? 'var(--warn)' : 'var(--text)';

  const word = p.running ? 'running' : fresh ? 'ready' : 'paused';
  const st = $('pomo-state');
  st.textContent = `${PHASE_WORD[p.phase]} · ${word}`;
  st.className = 'note state ' + word;

  $('pomo-go').textContent = p.running ? 'Pause' : fresh ? 'Start' : 'Resume';
  // The same button either way, because it is the same question -- leave this
  // phase and take the next one. A phase not yet started has nothing to put
  // back, so leaving it is a skip; one part-way through has, so it is a reset.
  $('pomo-hold').textContent = fresh ? 'Skip' : 'Reset';
  $('pomo-clear').disabled = p.done === 0 && fresh && p.phase === 'focus';

  // A cell each, because what is being counted is four things and not a
  // percentage. The block running now fills its own as it goes.
  let cells = '';
  for (let i = 0; i < p.set; i++) {
    let f = 0;
    if (i < p.done) f = 1;
    else if (i === p.done && p.phase === 'focus' && !fresh) f = (p.len - left) / p.len;
    cells += `<i><b style="--f:${Math.max(0, Math.min(1, f)).toFixed(3)}"></b></i>`;
  }
  $('pomo-set').innerHTML = cells;
}

// --- drawing the lot ------------------------------------------------------------------

function render() {
  const now = serverNow();
  const d = state.data || {};

  $('bar').className = 'bar' + (state.online ? '' : ' off');
  $('link').textContent = state.online ? 'connected' : 'offline';
  $('stamp').textContent = state.busy ? 'refreshing'
                         : state.baseAt ? `updated ${Math.floor(sinceFetch())}s ago`
                                        : '';

  drawClock(now, d.weather);
  drawUsage(d.usage, now);
  drawMac(d.mac, d.cpu);
  drawPomo(d.pomo);

  // A phase that has run out is settled by the server, and this is what
  // notices: it holds the only clock ticking between polls.
  if (d.pomo && d.pomo.running && pomoLeft(d.pomo) <= 0) poll();
}

// --- the readings ------------------------------------------------------------------------

// The server holds each reading for as long as the panel would, so a poll this
// often costs one loopback request at most and usually none.
const POLL_MS = 2000;

async function poll() {
  if (state.busy) return;
  state.busy = true;

  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    const d = await r.json();
    state.data = d;
    state.baseNow = d.now;
    state.baseAt = performance.now();
    state.online = true;
  } catch (e) {
    // Nothing answered: the Mac slept, the phone moved off the network, or the
    // window this server was started in got closed. Whatever is already up
    // stays up and goes on ageing, which is the honest thing for it to do.
    state.online = false;
  }

  state.busy = false;
  render();
}

async function pomoDo(action) {
  try {
    const r = await fetch('/api/pomo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ do: action }),
    });
    const p = await r.json();
    // Straight into what is on screen rather than waiting for the next poll: a
    // button that takes two seconds to look pressed is one people press twice.
    if (state.data) state.data.pomo = p;
    state.baseAt = performance.now();
    state.online = true;
  } catch (e) {
    state.online = false;
  }
  render();
}

$('refresh').addEventListener('click', poll);
$('pomo-go').addEventListener('click', () => pomoDo('start'));
$('pomo-hold').addEventListener('click', () => pomoDo('hold'));
$('pomo-clear').addEventListener('click', () => pomoDo('clear'));

// Keep the screen lit while the page is the thing in front of you. It is a
// panel; a panel that blanks after thirty seconds is a window you keep waking.
let wakeLock = null;
async function holdScreen() {
  try {
    if ('wakeLock' in navigator && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) { /* not offered, or refused: nothing to fall back to */ }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  // A phone that has been in a pocket has a page full of numbers from before it
  // went in there, and timers that were throttled while it was.
  holdScreen();
  poll();
});

render();
poll();
setInterval(poll, POLL_MS);
setInterval(render, 1000);   // the clock, the countdown and the ages
holdScreen();
</script>
</body>
</html>
