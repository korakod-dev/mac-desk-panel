<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080c08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Desk panel</title>

<!--
  The panel, as one page.

  Drawn on a 320-wide canvas with the arithmetic in src/dashboard/main.cpp,
  scaled up to whatever the phone gives it -- not rebuilt out of divs at a
  phone's proportions. The point of looking at this is that it is the panel:
  the same cards in the same hues, the same gradient across the same bar, the
  same fold when a minute turns.

  What is different is the height, and it is the only thing that had to be. The
  panel has 320x170 and shows one page of four at a time; a phone has the
  height to hold three of them at once, so the clock, the two Claude Code
  windows and the Mac are stacked rather than cycled, and the page dots that
  used to say which one you were on are gone with the cycling. Everything else
  keeps the panel's own y-arithmetic within its section.

  Colours are kept as RGB565 and converted on the way out, so shade() here
  rounds where shade() on the panel rounds. Type is the face the .vlw fonts
  were baked from, served off the same server, so a phone with no route to the
  internet still gets it.

  Three things are honestly not the same, and are not pretending to be:

    - the status bar says HTTP or OFFLINE where the panel says USB or WiFi,
      because that is what the link is here.
    - the hint bar names what a phone can do. The panel's hints name buttons
      that are not on this thing.
    - the panel's own vitals are not here and cannot be. Heap, PSRAM, RSSI and
      the boot reason are the ESP32's, and nothing on this side knows them.
-->

<style>
  @font-face {
    font-family: PanelUI;
    src: url(/font.ttf) format('truetype');
    font-display: block;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: #080c08;   /* C_BG, the panel's own near-black */
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  canvas { display: block; }
</style>
</head>

<body>
<canvas id="panel"></canvas>

<script>
"use strict";

// --- the panel's geometry, from src/dashboard/main.cpp -------------------------

const W = 320;
const BAR_TOP = 20, BAR_BOTTOM = 18;

const CARD_X = 4, CARD_W = W - 8, CARD_R = 6, CARD_PAD = 6;
const BAR_H = 14;

// The flip clock, at the panel's own dimensions. Only FLIP_TOP moves, and only
// because the section under it is no longer a page away.
const FLIP_W = 68, FLIP_H = 88, FLIP_TOP = 28, FLIP_R = 8;
const FLIP_PAIR = 6, FLIP_COLON = 22;
const FLIP_MID = FLIP_TOP + FLIP_H / 2;
const FLIP_HALF = FLIP_H / 2;
const FLIP_MS = 360;
const WEATHER_Y = 138;

// Claude Code usage: a heading and two gauges, at the panel's 56px pitch.
const U_HEAD_Y = 164;
const U_G1 = 176, U_G2 = 232, U_CH = 52;

// The Mac: a heading, the charge card, the three cells, the cores.
const M_HEAD_Y = 306;
const M_BY = 318, M_BCH = 48;
const M_BAR_Y = M_BY + 15, M_DETAIL_Y = M_BY + 35;
const M_GRID_Y = 374, M_GRID_H = 26;
const M_CTOP = 410, M_CBOT = 440;

const H = 464;
const BODY_BOT = H - BAR_BOTTOM;

// --- and its theme, still in RGB565 --------------------------------------------

const C = {
  BG: 0x0861, BAR: 0x18E3, TEXT: 0xFFFF, DIM: 0x8C71,
  ACCENT: 0x05FF, WARM: 0xFD20, OK: 0x2FEB, ERR: 0xF9C7,
  TEAL: 0x0656, BLUE: 0x2BDF, VIOLET: 0x8A7F, MAGENTA: 0xF9F4,
};
const FLIP_HUES = [C.TEAL, C.BLUE, C.VIOLET, C.MAGENTA];
const C_ECORE = C.TEAL, C_PCORE = C.MAGENTA;

// A darker cast of a colour, scaled in RGB565's own channel widths -- the same
// truncation the panel does, so a card is the same colour on both.
function shade(c, pct) {
  const r = (c >> 11) & 0x1F, g = (c >> 5) & 0x3F, b = c & 0x1F;
  return ((((r * pct / 100) | 0) << 11) |
          (((g * pct / 100) | 0) << 5) |
          ((b * pct / 100) | 0));
}

// 565 out to 888 by bit replication, which is what the driver does on the way
// to the glass.
function css(c) {
  const r = (c >> 11) & 0x1F, g = (c >> 5) & 0x3F, b = c & 0x1F;
  return `rgb(${(r << 3) | (r >> 2)},${(g << 2) | (g >> 4)},${(b << 3) | (b >> 2)})`;
}

// --- the drawing primitives TFT_eSPI gives the firmware -------------------------

const cv = document.getElementById("panel");
const ctx = cv.getContext("2d");

// One device pixel, in the panel's own units. Set by fit(), and needed by the
// one thing here drawn a pixel at a time.
let PXW = 1;

function rect(x, y, w, h, c) {
  ctx.fillStyle = css(c);
  ctx.fillRect(x, y, w, h);
}

function roundPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function fillRound(x, y, w, h, r, c) {
  ctx.fillStyle = css(c);
  roundPath(x, y, w, h, r);
  ctx.fill();
}

function drawRound(x, y, w, h, r, c) {
  ctx.strokeStyle = css(c);
  ctx.lineWidth = 1;
  roundPath(x + 0.5, y + 0.5, w - 1, h - 1, r);
  ctx.stroke();
}

// fillCircle(x, y, r) on the panel covers 2r+1 pixels across, centred on the
// pixel at x,y -- hence the half-pixel offsets.
function circle(x, y, r, c) {
  ctx.fillStyle = css(c);
  ctx.beginPath();
  ctx.arc(x + 0.5, y + 0.5, r + 0.5, 0, Math.PI * 2);
  ctx.fill();
}

function hline(x, y, w, c) { rect(x, y, w, 1, c); }

// The panel's setViewport, which is how the fold gets its shape.
function clipTo(x, y, w, h, draw) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  draw();
  ctx.restore();
}

function font(px) { ctx.font = px + 'px PanelUI, system-ui, sans-serif'; }
function tw(s)    { return Math.round(ctx.measureText(s).width); }

// The datum strings are TFT_eSPI's: first letter the vertical anchor, second
// the horizontal one.
function text(s, x, y, c, datum) {
  ctx.fillStyle = css(c);
  ctx.textAlign = datum[1] === 'L' ? 'left' : datum[1] === 'R' ? 'right' : 'center';
  ctx.textBaseline = datum[0] === 'M' ? 'middle' : 'top';
  ctx.fillText(s, x, y);
}

// --- the two ramps ---------------------------------------------------------------

// Cool-to-hot across a filled bar, matching the terminal's status line.
function rampColor(t) {
  let r, g;
  if (t < 0.5) { r = (t * 2 * 255) | 0; g = 255; }
  else         { r = 255; g = ((1 - t) * 2 * 255) | 0; }
  return ((r & 0xF8) << 8) | ((g & 0xFC) << 3);
}

function severityColor(pct) {
  if (pct >= 85) return C.ERR;
  if (pct >= 60) return C.WARM;
  return C.OK;
}

// Charge reads the opposite way to the usage windows: a full bar is the good
// end, so severityColor() would paint a healthy battery red.
function chargeColor(pct) {
  if (pct <= 20) return C.ERR;
  if (pct <= 50) return C.WARM;
  return C.OK;
}

function tempColor(t) {
  if (t >= 35) return C.ERR;
  if (t >= 30) return C.WARM;
  if (t <= 20) return C.ACCENT;
  return C.OK;
}

// --- spans and clocks -------------------------------------------------------------

const WDAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MON  = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
              'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

const pad2 = n => String(n).padStart(2, '0');

// "2d 5h" / "3h 05m" / "12m", empty for anything non-positive.
function spanText(seconds) {
  if (!(seconds > 0)) return '';
  const dd = Math.floor(seconds / 86400);
  const hh = Math.floor((seconds % 86400) / 3600);
  const mm = Math.floor((seconds % 3600) / 60);
  if (dd > 0) return `${dd}d ${hh}h`;
  if (hh > 0) return `${hh}h ${pad2(mm)}m`;
  return `${mm}m`;
}

// Wall-clock reset, with the weekday once it is more than a day out.
function resetClock(reset, now) {
  if (reset <= 0) return '';
  const d = new Date(reset * 1000);
  const clock = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  return reset < now + 86400 ? clock : `${WDAY[d.getDay()]} ${clock}`;
}

// --- the shapes the sections are built from ----------------------------------------

function cardBody(x, y, w, h, r, top, bot) {
  const half = h >> 1;
  fillRound(x, y, w, h, r, top);
  fillRound(x, y + half, w, h - half, r, bot);
  rect(x, y + half, w, r, bot);
}

function panelCard(x, y, w, h, hue) {
  cardBody(x, y, w, h, CARD_R, shade(hue, 26), shade(hue, 18));
  drawRound(x, y, w, h, CARD_R, shade(hue, 62));
}

function chip(x, cy, label, hue) {
  font(16);
  const w = tw(label) + 12, h = 18;
  fillRound(x, cy - h / 2, w, h, 5, hue);
  text(label, x + w / 2, cy, C.BG, 'MC');
  return x + w;
}

// Label left, value right, within a column. Values that would run into the
// label are clipped rather than written over it.
function row(x, w, y, label, value, color, labelColor) {
  font(16);
  text(label, x, y, labelColor === undefined ? C.DIM : labelColor, 'TL');

  const avail = w - tw(label) - 8;
  let shown = String(value);
  if (tw(shown) > avail) {
    while (shown.length > 1 && tw(shown + '..') > avail) shown = shown.slice(0, -1);
    shown += '..';
  }
  text(shown, x + w, y, color, 'TR');
}

// A chip, a track, and the figure the track is a picture of. Shared so that the
// usage gauges and the Mac's charge line up because they are the same code.
function barRow(cx, cw, cy, label, hue, value, valueColor) {
  const left = chip(cx + CARD_PAD, cy, label, hue) + 10;

  font(24);
  let right = cx + cw - CARD_PAD;
  if (value) {
    text(value, right, cy, valueColor, 'MR');
    right -= tw(value) + 10;
  }

  const t = { x: left, w: right - left };
  if (t.w > 0) rect(t.x, cy - BAR_H / 2, t.w, BAR_H, shade(hue, 10));
  return t;
}

// Each column is a pixel of the panel and rather more than a pixel here, so it
// is drawn a device pixel wider and laid over the one after it. Butted exactly
// edge to edge, every seam lands mid-pixel and gets antialiased against the
// background, and a smooth ramp comes out combed.
function gradientFill(t, cy, pct) {
  let filled = Math.floor(t.w * pct / 100);
  if (filled > t.w) filled = t.w;
  if (filled < 2 && pct > 0) filled = 2;
  for (let x = 0; x < filled; x++) {
    rect(t.x + x, cy - BAR_H / 2, x === filled - 1 ? 1 : 1 + PXW, BAR_H,
         rampColor(x / t.w));
  }
}

// The separator under a bar: a drawn dot, because make_vlw.py bakes printable
// ASCII and the degree sign and a middle dot would come out blank. Kept drawn
// here so the two sides say the same thing in the same shape.
function detailLine(x, y, head, tail) {
  font(16);
  text(head, x, y, C.DIM, 'ML');
  if (!tail) return;
  const dx = x + tw(head) + 9;
  circle(dx, y, 1, C.DIM);
  text(tail, dx + 9, y, C.DIM, 'ML');
}

// --- the flip clock ----------------------------------------------------------------

// Left edge of card i. 4*68 + 2*6 + 22 comes to 306 of the 320 there are.
function flipX(i) {
  const span = 4 * FLIP_W + 2 * FLIP_PAIR + FLIP_COLON;
  return (W - span) / 2 + i * (FLIP_W + FLIP_PAIR) +
         (i >= 2 ? FLIP_COLON - FLIP_PAIR : 0);
}

// One whole card: the two-tone body, the digit over it, and the seam over that.
// `lit` scales the colour -- 100 is a card at rest, less is one in flight.
//
// The digit is centred on its ink rather than on its line box. The firmware
// carries a measured 4px fudge for this because TFT_eSPI will not tell it where
// the ink is; a canvas will, so it is asked.
function flipFace(x, hue, d, lit) {
  cardBody(x, FLIP_TOP, FLIP_W, FLIP_H, FLIP_R,
           shade(hue, lit), shade(hue, (lit * 72 / 100) | 0));

  font(88);
  const m = ctx.measureText(d);
  const ink = (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
  ctx.fillStyle = css(shade(C.TEXT, lit));
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(d, x + FLIP_W / 2, FLIP_MID + ink);

  // Last, and over the digit: a split-flap's split runs through the number.
  hline(x, FLIP_MID - 1, FLIP_W, C.BG);
  hline(x, FLIP_MID, FLIP_W, shade(hue, 35));
}

const flipShown = ['-', '-', '-', '-'];
const flipFrom  = ['-', '-', '-', '-'];
let flipMask = 0, flipStart = 0, flipSeeded = false;

function flipping() { return flipStart !== 0; }

// Noticed here rather than in the poll, because here is where the clock is
// already being read.
function flipSet(face) {
  let moved = 0;
  for (let i = 0; i < 4; i++) {
    if (face[i] === flipShown[i]) continue;
    flipFrom[i] = flipShown[i];
    flipShown[i] = face[i];
    moved |= 1 << i;
  }
  // The first draw of all only ever seeds the cards. Later ones fold whatever
  // has changed, including the several that will have changed while the phone
  // was in a pocket -- arriving to find the clock catching up to itself is what
  // a split-flap board does.
  if (moved && flipSeeded) { flipMask = moved; flipStart = performance.now(); }
  flipSeeded = true;
}

function drawFlip(now) {
  const d = new Date(now * 1000);
  flipSet(pad2(d.getHours()) + pad2(d.getMinutes()));

  let elapsed = flipStart ? performance.now() - flipStart : FLIP_MS;
  if (elapsed >= FLIP_MS) { flipStart = 0; flipMask = 0; elapsed = FLIP_MS; }

  for (let i = 0; i < 4; i++) {
    const x = flipX(i), hue = FLIP_HUES[i];

    if (!(flipMask & (1 << i))) { flipFace(x, hue, flipShown[i], 100); continue; }

    // What the fold happens over: the new digit's upper half already in place,
    // the old one's lower half still standing until the leaf comes down to it.
    flipFace(x, hue, flipShown[i], 100);
    clipTo(x, FLIP_MID, FLIP_W, FLIP_H - FLIP_HALF,
           () => flipFace(x, hue, flipFrom[i], 100));

    const t = elapsed / FLIP_MS;
    if (t < 0.5) {
      // The old upper leaf closing onto the seam, darkening as it turns away.
      const p = t * 2, h = (FLIP_HALF * (1 - p)) | 0;
      if (h > 0) {
        clipTo(x, FLIP_MID - h, FLIP_W, h,
               () => flipFace(x, hue, flipFrom[i], (100 - 45 * p) | 0));
      }
    } else {
      // The new lower leaf opening back out of it, brightening as it comes
      // round to face you.
      const p = t * 2 - 1, h = (FLIP_HALF * p) | 0;
      if (h > 0) {
        clipTo(x, FLIP_MID, FLIP_W, h,
               () => flipFace(x, hue, flipShown[i], (55 + 45 * p) | 0));
      }
    }
  }

  // The colon belongs to neither pair and would have to be a fifth card to be
  // typed, so it is drawn. It softens on the odd second and comes back on the
  // even, which is this section's only answer to "is this thing still running".
  const dot = (new Date(now * 1000).getSeconds() & 1) ? C.DIM : C.TEXT;
  const cx = (flipX(1) + FLIP_W + flipX(2)) / 2;
  circle(cx, FLIP_MID - 16, 4, dot);
  circle(cx, FLIP_MID + 16, 4, dot);
}

// The strip under the cards: how warm it is, and what that feels like.
function drawWeather(w) {
  if (!w || w.error || w.temp === undefined) {
    font(16);
    text(w && w.error ? w.error : 'loading...', W / 2, WEATHER_Y, C.ERR, 'MC');
    return;
  }

  // Rounded to the degree: the tenth is not a figure anybody reads off a panel
  // across a room.
  const air = Math.round(w.temp) + '°';
  const feel = Math.round(w.feels) + '°';
  const tag = 'feels like';

  // Measured in both faces before anything is drawn, because the whole group is
  // centred and its width is not known until every piece has been asked.
  font(24);
  const wAir = tw(air);
  font(16);
  const wTag = tw(tag), wFeel = tw(feel);

  const GAP = 14;
  let x = (W - (wAir + GAP + 2 + GAP + wTag + 6 + wFeel)) / 2;

  font(24);
  text(air, x, WEATHER_Y, tempColor(w.temp), 'ML');
  x += wAir + GAP;

  circle(x + 1, WEATHER_Y, 1, C.DIM);
  x += 2 + GAP;

  font(16);
  text(tag, x, WEATHER_Y, C.DIM, 'ML');
  x += wTag + 6;

  // The label stays dim and the figure carries the colour, so that the gap
  // between 31 and 38 is what the line is for.
  text(feel, x, WEATHER_Y, tempColor(w.feels), 'ML');
}

// --- Claude Code usage ---------------------------------------------------------------

// One window, on one card. The card says which window; the gradient across the
// bar and the colour of the figure say how full it is.
function gauge(label, y, hue, pct, reset, now) {
  const cy = y + 16;
  panelCard(CARD_X, y, CARD_W, U_CH, hue);

  if (!(pct >= 0)) {
    const t = barRow(CARD_X, CARD_W, cy, label, hue, '', C.DIM);
    font(16);
    text('waiting for a reading', t.x + 8, cy, C.DIM, 'ML');
    return;
  }

  const t = barRow(CARD_X, CARD_W, cy, label, hue, pct + '%', severityColor(pct));
  gradientFill(t, cy, pct);

  if (!reset || reset <= 0) return;
  detailLine(CARD_X + CARD_PAD, y + 38,
             'resets ' + resetClock(reset, now), spanText(reset - now) &&
             'in ' + spanText(reset - now));
}

function drawUsage(u, now, age) {
  font(16);
  text('Claude Code usage', 8, U_HEAD_Y, C.MAGENTA, 'ML');

  const valid = u && !u.error && (u.h5 >= 0 || u.d7 >= 0);

  if (!valid) {
    // The heading stays and the cards go: two empty cards would say the reading
    // was zero rather than absent.
    text(u && u.error ? u.error : 'waiting for a reading',
         W / 2, U_G1 + 40, C.ERR, 'MC');
    return;
  }

  // How old the reading is matters as much as the reading: the files behind it
  // only move when something else writes them. One the host went and asked for
  // says "live" instead of counting the seconds since.
  if (age >= 0) {
    const label = u.live ? 'live'
                : age < 90 ? age + 's ago'
                           : Math.floor(age / 60) + 'm ago';
    text(label, W - 8, U_HEAD_Y, age > 900 ? C.WARM : C.DIM, 'MR');
  }

  gauge('5H', U_G1, C.TEAL,   u.h5, u.h5_reset, now);
  gauge('7D', U_G2, C.VIOLET, u.d7, u.d7_reset, now);
}

// --- the Mac -------------------------------------------------------------------------

// Column width and gap for the n core bars. Ported from layout.h, which the
// firmware's own test exercises: gaps give way before bars do, because past a
// dozen cores the separations would cost more of the panel than the things
// being separated.
function cpuBarLayout(n, width, margin, split) {
  if (n < 1) n = 1;
  const gap = n <= 12 ? 4 : n <= 20 ? 3 : 2;
  let bw = Math.floor((width - 2 * margin - split - (n - 1) * gap) / n);
  if (bw > 22) bw = 22;
  if (bw < 2) bw = 2;
  return { bw, gap };
}

// How the panel words the display field. "asleep" is the reason for the
// translation: the server means the screens are off while the machine is up,
// and "asleep" printed beside "MacBook" says the opposite of what it means.
function screenWord(display, answering) {
  if (!answering) return 'not answering';
  return display === 'external' ? 'external'
       : display === 'builtin'  ? 'built-in'
       : display === 'asleep'   ? 'screen off'
       : display === 'none'     ? 'no screen'
                                : null;
}

function drawMac(m, cpu, macAge) {
  const valid = m && !m.error;
  const answering = valid && macAge >= 0 && macAge <= 30;

  font(16);
  text('MacBook', 8, M_HEAD_Y, C.BLUE, 'ML');
  let headLeft = 8 + tw('MacBook');

  // A failed poll leaves the last reading on screen rather than blanking the
  // section, so the age has to be visible or a charge figure from hours ago
  // reads as current. Shown only once it is old enough to mislead.
  if (valid && macAge > 90) {
    const stale = Math.floor(macAge / 60) + 'm ago';
    text(stale, headLeft + 10, M_HEAD_Y, C.WARM, 'ML');
    headLeft += 10 + tw(stale);
  }

  let headRight = W - 8;

  // The power state sits opposite the heading -- the one word that changes what
  // the battery number means.
  if (valid && m.bat_state) {
    const onPower = m.bat_state !== 'discharging';
    text(m.bat_state, headRight, M_HEAD_Y, onPower ? C.OK : C.DIM, 'MR');
    headRight -= tw(m.bat_state) + 12;
  }

  if (valid && m.display) {
    const word = screenWord(m.display, answering);
    // Gives way to the staleness badge, which is the one that says whether any
    // of this is worth reading at all.
    if (word && headRight - tw(word) > headLeft + 10) {
      text(word, headRight, M_HEAD_Y, answering ? C.DIM : C.WARM, 'MR');
    }
  }

  // The charge card, drawn before anything that sits on it -- which by now
  // includes the cores' key.
  panelCard(CARD_X, M_BY, CARD_W, M_BCH, C.BLUE);

  const haveCpu = cpu && !cpu.error && cpu.cores && cpu.cores.length > 0;
  const split = haveCpu && cpu.ecores > 0 && cpu.pcores > 0;
  let keyLeft = CARD_X + CARD_W - CARD_PAD;

  // The cores' key, on the right of the detail line: the cluster mix, each half
  // in its own colour, which is what stops the bars below being an unlabelled
  // row of colours. Up here because there is no room over them.
  if (split) {
    font(16);
    const e = cpu.ecores + 'E', p = cpu.pcores + 'P';
    let x = CARD_X + CARD_W - CARD_PAD - (tw(e) + tw('+') + tw(p));
    keyLeft = x;
    text(e, x, M_DETAIL_Y, C_ECORE, 'ML'); x += tw(e);
    text('+', x, M_DETAIL_Y, C.DIM, 'ML'); x += tw('+');
    text(p, x, M_DETAIL_Y, C_PCORE, 'ML');
  }

  if (!valid) {
    // Only the top half is missing: the cores come from a different request and
    // may well have answered, so the error takes the space the battery would
    // have had and the columns below still draw.
    font(16);
    text(m && m.error ? m.error : 'loading...', W / 2, M_BAR_Y, C.ERR, 'MC');
  } else {
    const pct = m.bat_pct >= 0 ? m.bat_pct : -1;
    const t = barRow(CARD_X, CARD_W, M_BAR_Y, 'BAT', C.BLUE,
                     pct >= 0 ? pct + '%' : '', chargeColor(pct));

    if (pct >= 0 && t.w > 0) {
      let filled = Math.floor(t.w * pct / 100);
      if (filled > t.w) filled = t.w;
      if (filled < 2 && pct > 0) filled = 2;
      // Flat rather than the usage page's ramp: there the gradient tracks a cost
      // rising toward its limit, here it would just be decoration.
      rect(t.x, M_BAR_Y - BAR_H / 2, filled, BAR_H, chargeColor(pct));
    }

    const left = spanText(m.bat_mins * 60);
    const head = left ? left + ' left' : 'no estimate';
    const upFor = spanText(m.uptime_s);

    font(16);
    // The uptime gives way to the cores' key when the two would meet, the way
    // the seconds give way to the temperature on the clock.
    const fits = upFor &&
      CARD_X + CARD_PAD + tw(head) + 9 + 9 + tw('up ' + upFor) < keyLeft - 8;
    detailLine(CARD_X + CARD_PAD, M_DETAIL_Y, head, fits ? 'up ' + upFor : '');
  }

  // The three cells that say how much of the machine is spoken for, each on its
  // own card and the ramp running left to right across them. The figures stay
  // on the severity ramp, which is where "is 91% a problem" is answered.
  const GW = 100, G1 = CARD_X, G2 = 110, G3 = 216;
  const GT = M_GRID_Y + 1;       // row() takes the top of the line box
  const GI = GW - 2 * CARD_PAD;

  panelCard(G1, M_GRID_Y, GW, M_GRID_H, C.TEAL);
  panelCard(G2, M_GRID_Y, GW, M_GRID_H, C.VIOLET);
  panelCard(G3, M_GRID_Y, GW, M_GRID_H, C.MAGENTA);

  const cell = (x, label, v, hue) =>
    row(x + CARD_PAD, GI, GT, label, v >= 0 ? v + '%' : '--',
        v >= 0 ? severityColor(v) : C.DIM, hue);

  cell(G1, 'Mem',  valid ? m.mem_used  : -1, C.TEAL);
  cell(G2, 'Disk', valid ? m.disk_used : -1, C.VIOLET);
  cell(G3, 'CPU',  haveCpu && cpu.avg >= 0 ? cpu.avg : -1, C.MAGENTA);

  // --- the cores ---------------------------------------------------------------

  if (!haveCpu) {
    font(16);
    text(cpu && cpu.error ? cpu.error : 'loading...',
         W / 2, (M_CTOP + M_CBOT) / 2, C.ERR, 'MC');
    return;
  }

  const MARGIN = 4, SPLIT = split ? 10 : 0, CH = M_CBOT - M_CTOP;
  const n = cpu.cores.length;
  const { bw, gap } = cpuBarLayout(n, W, MARGIN, SPLIT);

  // The unlit part of each column carries the cluster colour too, at a level
  // that stays behind the fill -- without it an idle Mac is a row of identical
  // grey columns and the distinction disappears exactly when the gap between
  // the groups is the only thing left to read.
  const TRACK_E = shade(C_ECORE, 34), TRACK_P = shade(C_PCORE, 34);

  const span = n * bw + (n - 1) * gap + SPLIT;
  let x0 = (W - span) / 2;
  if (x0 < MARGIN) x0 = MARGIN;

  for (let i = 0; i < n; i++) {
    const perf = split && i >= cpu.ecores;
    const x = x0 + i * (bw + gap) + (perf ? SPLIT : 0);
    if (x + bw > W - MARGIN) break;

    let pct = cpu.cores[i];
    if (!(pct >= 0)) pct = 0;
    if (pct > 100) pct = 100;

    const hue   = !split ? C.BLUE            : (perf ? C_PCORE : C_ECORE);
    const track = !split ? shade(C.BLUE, 34) : (perf ? TRACK_P : TRACK_E);

    rect(x, M_CTOP, bw, CH, track);

    let filled = Math.floor(CH * pct / 100);
    if (filled < 2 && pct > 0) filled = 2;
    // Grown from the bottom, so a row of columns reads as level rather than as
    // a set of separate bars that happen to share a baseline.
    if (filled > 0) rect(x, M_CBOT - filled, bw, filled, hue);
  }
}

// --- the chrome ---------------------------------------------------------------------

// It blinks, in the red the rest of the panel keeps for things that are wrong.
// A sleeping Mac is not wrong -- it is the ordinary state of that machine for
// two thirds of the day -- so this is the one place the severity ramp is spent
// on something that is merely worth being certain of.
const SLEEP_BLINK_MS = 500;
const blinkOn = () => Math.floor(performance.now() / SLEEP_BLINK_MS) % 2 === 0;

// "sleep" is the only reason for a dark Mac this will say out loud. The panel
// refuses the other two -- a machine awake and untended, and a host that simply
// stopped answering -- because neither is the machine having gone to bed.
function restLabel(m, macAge) {
  if (!m || m.error) return null;
  const answering = macAge >= 0 && macAge <= 30;
  const screensOn = !(m.display === 'asleep' || m.display === 'none');
  const tended = !(m.idle >= 0) || m.idle <= 600;
  const awake = answering && screensOn && tended;
  if (awake) return null;
  return screensOn ? null : 'sleep';
}

function drawStatusBar(now, online, rest) {
  rect(0, 0, W, BAR_TOP, C.BAR);
  font(16);

  const link = online ? 'HTTP' : 'OFFLINE';
  text(link, 6, BAR_TOP / 2, online ? C.OK : C.ERR, 'ML');

  // Beside the link rather than anywhere else on the bar, because the two are
  // read together: the link says whether the page can still see the Mac, and
  // this says what it sees.
  if (rest && blinkOn()) {
    text(rest, 6 + tw(link) + 7, BAR_TOP / 2, C.ERR, 'ML');
  }

  const d = new Date(now * 1000);
  text(`${WDAY[d.getDay()]} ${pad2(d.getDate())} ${MON[d.getMonth()]}`,
       W - 6, BAR_TOP / 2, C.TEXT, 'MR');
}

function drawHintBar(left, right) {
  rect(0, BODY_BOT, W, BAR_BOTTOM, C.BAR);
  font(16);
  text(left, 6, BODY_BOT + BAR_BOTTOM / 2, C.DIM, 'ML');
  text(right, W - 6, BODY_BOT + BAR_BOTTOM / 2, C.DIM, 'MR');
}

// --- what is on screen ----------------------------------------------------------------

const state = {
  data: null,        // the last answer that arrived
  online: true,
  busy: false,
  baseNow: 0,        // the Mac's clock at that answer
  baseAt: 0,         // performance.now() when it arrived
};

// The Mac's clock rather than the phone's. Every reset time in the payload is
// an epoch the Mac worked out, and a phone whose clock has drifted would push
// every countdown on the page by the drift.
function serverNow() {
  if (!state.baseNow) return Math.floor(Date.now() / 1000);
  return Math.floor(state.baseNow + (performance.now() - state.baseAt) / 1000);
}

// How stale a reading is now, not how stale it was when it arrived: a failed
// poll would otherwise leave the age frozen and a dead link read as fresh.
function ageNow(reading) {
  if (!reading || reading.error || !(reading.age >= 0)) return -1;
  return reading.age + Math.floor((performance.now() - state.baseAt) / 1000);
}

function render() {
  const now = serverNow();
  const d = state.data || {};

  rect(0, 0, W, H, C.BG);

  drawStatusBar(now, state.online, restLabel(d.mac, ageNow(d.mac)));
  drawFlip(now);
  drawWeather(d.weather);
  drawUsage(d.usage, now, ageNow(d.usage));
  drawMac(d.mac, d.cpu, ageNow(d.mac));
  drawHintBar('tap  refresh', state.busy ? 'refreshing' : 'auto 2s');
}

// --- the readings -----------------------------------------------------------------------

// The server holds each reading for as long as the panel would, so a poll this
// often costs one loopback request at most and usually none.
const POLL_MS = 2000;

async function poll() {
  if (state.busy) return;
  state.busy = true;

  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    const d = await r.json();
    state.data = d;
    state.baseNow = d.now;
    state.baseAt = performance.now();
    state.online = true;
  } catch (e) {
    // Nothing answered at all: the Mac slept, the phone moved off the network,
    // or the window this server was started in got closed. Whatever is already
    // up stays up and goes on ageing, which is the honest thing for it to do.
    state.online = false;
  }

  state.busy = false;
  render();
}

// --- fitting it to the phone --------------------------------------------------------------

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = devicePixelRatio || 1;

  cv.style.width  = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
  cv.width  = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);

  // Resizing the backing store resets the context, so the transform goes on
  // after rather than before.
  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
  PXW = 1 / (s * dpr);
  render();
}

// Keep the screen lit while the page is the thing in front of you. It is a
// panel; a panel that blanks after thirty seconds is a window you keep waking.
let wakeLock = null;
async function holdScreen() {
  try {
    if ('wakeLock' in navigator && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) { /* not offered, or refused: nothing to fall back to */ }
}

// Half a second, because two things on the page move at that rate: the sleep
// word blinks at 2 Hz and the colon at 1. A fold borrows a faster frame for the
// third of a second it is in flight and gives it back, which is what the panel
// does and for the same reason -- 40ms frames all the time would be a phone
// redrawing a still picture sixty times a minute for nothing.
function tick() {
  render();
  if (flipping()) requestAnimationFrame(fold);
}

function fold() {
  render();
  if (flipping()) requestAnimationFrame(fold);
}

addEventListener('resize', fit);
addEventListener('orientationchange', fit);

cv.addEventListener('click', poll);

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  // A phone that has been in a pocket has a page full of numbers from before it
  // went in there, and timers that were throttled while it was.
  holdScreen();
  poll();
});

// Metrics before pixels: every row here is laid out from a measured string, so
// drawing before the face has loaded lays the page out for the fallback and
// then leaves it that way until something else redraws it.
Promise.all([
  document.fonts.load('16px PanelUI'),
  document.fonts.load('24px PanelUI'),
  document.fonts.load('88px PanelUI'),
]).catch(() => {}).then(() => {
  fit();
  poll();
  setInterval(poll, POLL_MS);
  setInterval(tick, SLEEP_BLINK_MS);
  holdScreen();
});
</script>
</body>
</html>
