; LilyGO T-Display-S3 (ESP32-S3 + ST7789 170x320, 8-bit parallel i8080)
;
;   pio run -e dashboard -t upload    Thai clock/weather dashboard
;   pio run -e selftest  -t upload    display self-test patterns
;
; The dashboard gets its network from whichever link answers. To run it off the
; USB-C cable with no WiFi at all, start the host side and leave it running:
;
;   python tools/usb_net_bridge.py    fetches on the panel's behalf, and
;                                     doubles as the serial monitor
;
; Two small servers feed the pages that show the host itself — both stdlib
; only, both installed as launch agents (see the plists beside them):
;
;   tools/usage_server.py     :8787   Claude Code 5h / 7d limits
;   tools/mac_stats_server.py :8789   battery, load, memory, disk, uptime
;
; It owns the serial port while it runs, so tools/grab_screen.py talks to its
; passthrough socket and uploads pause it automatically (see extra_scripts).

[base]
platform  = espressif32@6.9.0
board     = lilygo-t-display-s3
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600

; tools/usb_net_bridge.py owns the serial port while it runs; this asks it to
; step aside for the upload rather than making that a thing to remember.
extra_scripts = pre:tools/pio_bridge_pause.py

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

lib_deps =
	bodmer/TFT_eSPI@^2.5.43

build_flags =
	; --- native USB CDC so Serial works over the USB-C cable ---
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM

	; --- TFT_eSPI setup for T-Display-S3 (replaces User_Setup.h) ---
	-DUSER_SETUP_LOADED
	-DST7789_DRIVER
	-DINIT_SEQUENCE_3
	-DCGRAM_OFFSET
	-DTFT_RGB_ORDER=TFT_RGB
	-DTFT_INVERSION_ON
	-DTFT_PARALLEL_8_BIT
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320

	; control pins
	-DTFT_CS=6
	-DTFT_DC=7
	-DTFT_RST=5
	-DTFT_WR=8
	-DTFT_RD=9
	-DTFT_BL=38
	-DTFT_BACKLIGHT_ON=HIGH

	; 8-bit parallel data bus
	-DTFT_D0=39
	-DTFT_D1=40
	-DTFT_D2=41
	-DTFT_D3=42
	-DTFT_D4=45
	-DTFT_D5=46
	-DTFT_D6=47
	-DTFT_D7=48

	; fonts
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8
	-DLOAD_GFXFF
	-DSMOOTH_FONT


[env:dashboard]
extends = base
build_src_filter = +<dashboard/>
lib_deps =
	${base.lib_deps}
	bblanchon/ArduinoJson@^7.2.0

[env:selftest]
extends = base
build_src_filter = +<selftest/>
